name: Publish and Build Docker Image

run-name: >
  Image
  ${{ github.event_name == 'release' && github.ref_name
      || github.event_name == 'workflow_dispatch' && inputs.TAG_NAME
      || 'unknown-tag' }}

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      TAG_NAME:
        description: 'Tag name for test version'
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/rationai/tile-chan
  TAG_NAME: ${{ github.event.inputs.TAG_NAME || github.event.release.tag_name }}

jobs:

  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Packages
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        file: ./Dockerfile
        context: .
        target: runtime
        push: true
        # Only a release moves `latest`; a dispatch publishes the test tag alone.
        tags: |
          ${{ env.IMAGE }}:${{ env.TAG_NAME }}
          ${{ github.event_name == 'release' && format('{0}:latest', env.IMAGE) || '' }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        # The builder stage compiles libopenslide and the whole crate graph, so layer
        # caching between runs is what keeps a rebuild short.
        cache-from: type=gha
        cache-to: type=gha,mode=max
