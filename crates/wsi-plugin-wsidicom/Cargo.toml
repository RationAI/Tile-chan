[package]
name = "wsi-plugin-wsidicom"
# Tracks the Python plugin's version, because `/alive` reports it and the parity harness
# compares that response.
version = "0.4.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
image.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tracing.workspace = true
wsi-core.workspace = true
# `decode_chunk` and `Raster` from the TIFF reader. A DICOM frame set is a tiled image with
# one codec per instance, which is the same shape, and the JPEG path there already carries
# the APP14 handling a photometric-RGB frame needs.
wsi-plugin-tifffile.workspace = true

[dev-dependencies]
http.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
