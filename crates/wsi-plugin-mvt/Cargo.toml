[package]
name = "wsi-plugin-mvt"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
flate2.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
tokio.workspace = true
wsi-core.workspace = true

# `bundled` compiles SQLite from source, so `.mbtiles` support needs no system library at
# build or run time — the runtime image carries no sqlite package of its own.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
http.workspace = true
tokio = { workspace = true }
