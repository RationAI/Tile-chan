[workspace]
resolver = "2"
members = [
    "crates/wsi-core",
    "crates/wsi-plugin-pil",
    "crates/wsi-plugin-openslide",
    "crates/wsi-plugin-nifti",
    "crates/wsi-plugin-mvt",
    "crates/wsi-plugin-tifffile",
    "crates/wsi-plugin-tiffslide",
    "crates/wsi-plugin-wsidicom",
    "crates/wsi-mappers",
    "crates/wsi-auth",
    "crates/wsi-server",
    "crates/wsi-parity",
]

[workspace.package]
version = "0.15.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/rationAI/WSI-Service"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "query"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast = "1"
dotenvy = "0.15"
flate2 = "1"
futures = "0.3"
glob = "0.3"
http = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "tiff"] }
jsonwebtoken = "9"
lcms2 = "6"
lru = "0.12"
ndarray = "0.16"
parking_lot = "0.12"
percent-encoding = "2"
quick-xml = "0.37"
regex = "1"
ruzstd = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v5", "v4"] }
weezl = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

wsi-core = { path = "crates/wsi-core" }
wsi-mappers = { path = "crates/wsi-mappers" }
wsi-auth = { path = "crates/wsi-auth" }
wsi-plugin-pil = { path = "crates/wsi-plugin-pil" }
wsi-plugin-openslide = { path = "crates/wsi-plugin-openslide" }
wsi-plugin-nifti = { path = "crates/wsi-plugin-nifti" }
wsi-plugin-mvt = { path = "crates/wsi-plugin-mvt" }
wsi-plugin-tifffile = { path = "crates/wsi-plugin-tifffile" }
wsi-plugin-tiffslide = { path = "crates/wsi-plugin-tiffslide" }
wsi-plugin-wsidicom = { path = "crates/wsi-plugin-wsidicom" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
